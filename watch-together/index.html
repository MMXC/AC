<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起看 - 创建房间</title>
    <link rel="stylesheet" href="css/design-tokens.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --container-max-width: 520px;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-background);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--space-lg);
            color: var(--color-text);
        }

        .container {
            position: relative;
            background: var(--color-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            padding: var(--space-2xl) var(--space-xl) var(--space-xl);
            max-width: var(--container-max-width);
            width: 100%;
            text-align: center;
            border: 1px solid var(--color-border);
            overflow: hidden;
        }

        .container-inner {
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: var(--font-heading);
            color: var(--color-text);
            margin-bottom: var(--space-sm);
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 600;
        }

        .subtitle {
            color: var(--color-text-muted);
            margin-bottom: var(--space-lg);
            font-size: 0.98rem;
        }

        .form-group {
            margin-bottom: var(--space-md);
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: var(--space-sm);
            color: var(--color-text-muted);
            font-weight: 500;
            font-size: 0.92rem;
        }

        input {
            width: 100%;
            padding: var(--space-md);
            border-radius: var(--radius-md);
            font-size: 1rem;
            border: 1px solid var(--color-border);
            background-color: var(--color-surface);
            color: var(--color-text);
        }

        input::placeholder {
            color: var(--color-text-muted);
        }

        input:focus {
            border-color: var(--color-input-border-focus);
            box-shadow: 0 0 0 3px var(--color-focus-ring);
        }

        .create-btn {
            width: 100%;
            padding: var(--space-md) var(--space-lg);
            min-height: var(--touch-target-min);
            background: var(--color-cta);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: var(--space-md);
            box-shadow: var(--shadow-md);
        }

        .create-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .create-btn:active {
            transform: translateY(0);
        }

        .create-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: var(--space-lg);
            padding: var(--space-lg);
            background: var(--color-background);
            border-radius: var(--radius-lg);
            display: none;
            border: 1px solid var(--color-border);
        }

        .result.show {
            display: block;
        }

        .result h3 {
            color: var(--color-text);
            margin-bottom: var(--space-md);
            font-size: 1.05rem;
            font-weight: 600;
        }

        .room-info {
            text-align: left;
            margin-bottom: var(--space-md);
        }

        .room-info-item {
            margin-bottom: var(--space-sm);
        }

        .room-info-label {
            font-weight: 600;
            color: var(--color-text-muted);
            margin-right: var(--space-sm);
            font-size: 0.9rem;
        }

        .room-info-value {
            color: var(--color-text);
            word-break: break-all;
            font-size: 0.9rem;
        }

        .room-link {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            margin-top: var(--space-md);
        }

        .room-link input {
            flex: 1;
            background: var(--color-background);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            font-size: 0.9rem;
            border-radius: var(--radius-md);
        }

        .copy-btn {
            padding: var(--space-sm) var(--space-md);
            min-height: var(--touch-target-min);
            background: transparent;
            color: var(--color-primary);
            border: 2px solid var(--color-primary);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .copy-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .copy-btn:active {
            transform: translateY(0);
        }

        .error {
            color: var(--color-error);
            background-color: var(--color-error-soft);
            border-radius: var(--radius-md);
            border: 1px solid var(--color-error);
            padding: var(--space-sm) var(--space-md);
            margin-top: var(--space-md);
            display: none;
            font-size: 0.9rem;
            text-align: left;
        }

        .error.show {
            display: block;
        }

        .loading {
            display: none;
            margin-top: 10px;
            color: var(--color-primary);
            font-size: 0.9rem;
            text-align: left;
        }

        .loading.show {
            display: block;
        }

        @media (max-width: 640px) {
            .container {
                padding: var(--space-xl) var(--space-lg) var(--space-lg);
            }

            h1 {
                font-size: 1.7rem;
            }

            .room-link {
                flex-direction: column;
                align-items: stretch;
            }

            .copy-btn {
                width: 100%;
                text-align: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="container-inner">
            <h1>一起看</h1>
            <p class="subtitle">创建房间，与朋友一起观看</p>

            <form id="createRoomForm">
                <div class="form-group">
                    <label for="roomName">房间名称（可选）</label>
                    <input type="text" id="roomName" placeholder="例如：电影之夜">
                </div>

                <div class="form-group">
                    <label for="hostNickname">您的昵称（可选）</label>
                    <input type="text" id="hostNickname" placeholder="例如：房主">
                </div>

                <button type="submit" class="create-btn" id="createBtn">创建房间</button>

                <div class="loading" id="loading">正在创建房间...</div>
                <div class="error" id="error"></div>
            </form>

            <div class="result" id="result">
                <h3>房间创建成功！</h3>
                <div class="room-info">
                    <div class="room-info-item">
                        <span class="room-info-label">房间号：</span>
                        <span class="room-info-value" id="roomId"></span>
                    </div>
                    <div class="room-info-item">
                        <span class="room-info-label">房间名称：</span>
                        <span class="room-info-value" id="roomNameDisplay"></span>
                    </div>
                </div>
                <div class="room-link">
                    <input type="text" id="roomLink" readonly>
                    <button class="copy-btn" id="copyBtn">复制链接</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/create-room.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起看 - 房间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #2d2d2d;
            padding: 15px 20px;
            border-bottom: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.2em;
            font-weight: 600;
            color: #fff;
        }

        .room-info {
            font-size: 0.9em;
            color: #aaa;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: #2d2d2d;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid #404040;
        }

        .sidebar-section h2 {
            font-size: 1em;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
        }

        .room-id-display {
            font-size: 1.1em;
            font-weight: 600;
            color: #4a9eff;
            word-break: break-all;
        }

        .members-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .member-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #3a3a3a;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .member-item:hover {
            background: #444;
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #4a9eff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: 600;
            font-size: 0.85em;
            flex-shrink: 0;
        }

        .member-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .members-empty {
            color: #888;
            font-size: 0.9em;
            text-align: center;
            padding: 20px 0;
        }

        .browser-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            overflow: hidden;
        }

        .iframe-container {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa;
            font-size: 1em;
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e74c3c;
            text-align: center;
            padding: 20px;
        }

        .error h3 {
            margin-bottom: 10px;
        }

        .error p {
            color: #aaa;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>一起看</h1>
        <div class="room-info" id="roomInfo">房间加载中...</div>
    </div>
    
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-section">
                <h2>房间信息</h2>
                <div class="room-id-display" id="sidebarRoomId">加载中...</div>
            </div>
            <div class="sidebar-section" style="flex: 1; overflow-y: auto;">
                <h2>成员列表</h2>
                <ul class="members-list" id="membersList">
                    <li class="members-empty">暂无成员</li>
                </ul>
            </div>
        </div>
        <div class="browser-area">
            <div class="iframe-container">
                <div class="loading" id="loading">正在加载网页...</div>
                <div class="error" id="error" style="display: none;">
                    <h3>加载失败</h3>
                    <p id="errorMessage"></p>
                </div>
                <iframe id="browserFrame" style="display: none;"></iframe>
            </div>
        </div>
    </div>
    
    <script src="js/room.js"></script>
</body>
</html>

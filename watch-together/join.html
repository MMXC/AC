<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起看 - 房间</title>
    <link rel="stylesheet" href="css/design-tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body.shell {
            font-family: var(--font-body);
            background: var(--color-background);
            color: var(--color-text);
        }

        .header.shell__nav {
            padding: var(--space-md) var(--space-lg);
        }

        .header.shell__nav h1.shell__nav-title {
            font-family: var(--font-heading);
            font-size: clamp(1rem, 2.5vw, 1.2em);
            font-weight: 600;
            color: var(--color-text);
        }

        .room-info {
            font-size: 0.9em;
            color: var(--color-text-muted);
        }

        .main-container.shell__content.shell__main {
            flex: 1;
            display: flex;
            overflow: hidden;
            min-height: 0;
        }

        .sidebar.shell__sidebar {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--color-surface);
            border-right: 1px solid var(--color-border);
        }

        .sidebar-section {
            padding: var(--space-lg);
            border-bottom: 1px solid var(--color-border);
        }

        .sidebar-section h2 {
            font-size: 1em;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: var(--space-md);
        }

        .room-id-display {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--color-primary);
            word-break: break-all;
        }

        .members-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .member-item {
            padding: var(--space-md);
            margin-bottom: var(--space-sm);
            background: var(--color-background);
            border-radius: var(--radius-md);
            color: var(--color-text);
            font-size: 0.9em;
            display: flex;
            align-items: center;
            transition: background-color var(--transition-base);
        }

        .member-item:hover {
            background: var(--color-border);
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--color-primary);
            color: var(--color-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: var(--space-md);
            font-weight: 600;
            font-size: 0.85em;
            flex-shrink: 0;
        }

        .member-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .members-empty {
            color: var(--color-text-muted);
            font-size: 0.9em;
            text-align: center;
            padding: var(--space-lg) 0;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-top: 1px solid var(--color-border);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-md);
            background: var(--color-background);
        }

        .chat-message {
            margin-bottom: var(--space-md);
            padding: var(--space-md);
            background: var(--color-surface);
            border-radius: var(--radius-md);
            font-size: 0.9em;
            border: 1px solid var(--color-border);
        }

        .chat-message-header {
            display: flex;
            align-items: center;
            margin-bottom: var(--space-xs);
        }

        .chat-message-sender {
            font-weight: 600;
            color: var(--color-primary);
            margin-right: var(--space-sm);
        }

        .chat-message-time {
            font-size: 0.75em;
            color: var(--color-text-muted);
        }

        .chat-message-content {
            color: var(--color-text);
            word-wrap: break-word;
            line-height: 1.4;
        }

        .chat-input-container {
            padding: var(--space-md);
            border-top: 1px solid var(--color-border);
            background: var(--color-surface);
        }

        .chat-input-wrapper {
            display: flex;
            gap: var(--space-md);
        }

        .chat-input {
            flex: 1;
            padding: var(--space-md);
            min-height: var(--touch-target-min);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
        }

        .chat-input:focus {
            border-color: var(--color-input-border-focus);
            box-shadow: 0 0 0 3px var(--color-focus-ring);
        }

        .chat-send-button {
            padding: var(--space-md) var(--space-lg);
            min-height: var(--touch-target-min);
            background: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-send-button:hover {
            opacity: 0.9;
        }

        .chat-send-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .chat-empty {
            color: var(--color-text-muted);
            font-size: 0.9em;
            text-align: center;
            padding: var(--space-2xl) var(--space-lg);
        }

        .browser-area.shell__area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--color-background);
            overflow: hidden;
            min-width: 0;
        }

        .iframe-container {
            flex: 1;
            position: relative;
            background: var(--color-text);
            overflow: hidden;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: none;
            position: relative;
            background: #000;
            align-items: center;
            justify-content: center;
        }

        .video-container video,
        .video-container canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--color-text-muted);
            padding: var(--space-2xl);
        }

        .video-placeholder h3 {
            margin-bottom: var(--space-md);
            color: var(--color-text);
            font-size: 1.2em;
        }

        .video-placeholder p {
            color: var(--color-text-muted);
            font-size: 0.9em;
            line-height: 1.6;
        }

        .video-status {
            position: absolute;
            bottom: var(--space-md);
            left: 50%;
            transform: translateX(-50%);
            padding: var(--space-xs) var(--space-md);
            background: rgba(0, 0, 0, 0.65);
            color: var(--color-text-muted);
            font-size: 0.85em;
            border-radius: var(--radius-md);
            z-index: 2;
            pointer-events: none;
        }

        .url-control-container {
            position: absolute;
            top: var(--space-lg);
            right: var(--space-lg);
            display: none;
            z-index: 10;
        }

        .url-control-button {
            padding: var(--space-md) var(--space-lg);
            min-height: var(--touch-target-min);
            background: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-md);
        }

        .url-control-button:hover {
            opacity: 0.9;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--color-text-muted);
            font-size: 1em;
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--color-error);
            text-align: center;
            padding: var(--space-lg);
        }

        .error h3 {
            margin-bottom: var(--space-md);
        }

        .error p {
            color: var(--color-text-muted);
            font-size: 0.9em;
        }

        .start-sharing-button {
            padding: var(--space-md) var(--space-lg);
            min-height: var(--touch-target-min);
            background: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            margin-left: var(--space-md);
        }

        .start-sharing-button:hover {
            opacity: 0.9;
        }

        .start-sharing-button.streaming {
            background: var(--color-error);
        }

        .start-sharing-button.streaming:hover {
            opacity: 0.9;
        }

        .share-room-button {
            width: 100%;
            padding: var(--space-md) var(--space-lg);
            min-height: var(--touch-target-min);
            background: var(--color-primary);
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            margin-top: var(--space-md);
        }

        .share-room-button:hover {
            opacity: 0.9;
        }

        .share-room-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* 375px / 移动端视口适配：无横向滚动，侧栏抽屉，主内容区为主体 */
        @media (max-width: 480px) {
            body { min-width: 0; }
            .main-container {
                flex: 1;
                min-width: 0;
                overflow: hidden;
            }
            .browser-area {
                flex: 1;
                min-width: 0;
                min-height: 0;
            }
            .sidebar.shell__sidebar {
                position: fixed;
                top: 0;
                right: 0;
                width: 280px;
                max-width: 90vw;
                height: 100%;
                transform: translateX(100%);
                transition: transform var(--transition-base);
                z-index: 100;
                box-shadow: var(--shadow-xl);
            }
            .sidebar.shell__sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0,0,0,0.4);
                z-index: 99;
            }
            .sidebar-overlay.visible {
                display: block;
            }
            .header.shell__nav {
                flex-wrap: wrap;
                gap: var(--space-sm);
                min-height: var(--touch-target-min);
            }
            .header.shell__nav h1 { font-size: 1em; }
            .room-info { font-size: 0.8em; }
            .sidebar-close-btn {
                display: block;
                margin: var(--space-md) var(--space-lg) 0 auto;
                padding: var(--space-sm) var(--space-md);
                min-height: var(--touch-target-min);
                background: var(--color-background);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                color: var(--color-text);
                font-size: 0.9em;
                cursor: pointer;
            }
            .sidebar-toggle-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: var(--space-sm) var(--space-md);
                min-height: var(--touch-target-min);
                background: var(--color-background);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                color: var(--color-text);
                font-size: 0.9em;
                cursor: pointer;
            }
        }
        @media (min-width: 481px) {
            .sidebar-close-btn { display: none; }
            .sidebar-toggle-btn { display: none; }
        }
    </style>
</head>
<body class="shell">
    <header class="header shell__nav">
        <h1 class="shell__nav-title">一起看</h1>
        <div class="room-info" id="roomInfo">房间加载中...</div>
    </header>

    <div class="main-container shell__content shell__main">
        <aside class="sidebar shell__sidebar">
            <div class="sidebar-section">
                <h2>房间信息</h2>
                <div class="room-id-display" id="sidebarRoomId">加载中...</div>
                <button id="shareRoomButton" class="share-room-button" style="display: none;">分享房间链接</button>
            </div>
            <div class="sidebar-section" id="userInfoSection">
                <h2>我的信息</h2>
                <div id="userInfoDisplay" style="margin-bottom: 15px;">
                    <div style="font-size: 0.9em; color: #aaa; margin-bottom: 8px;">用户ID:</div>
                    <div class="room-id-display" id="currentUserId" style="font-size: 0.9em;">生成中...</div>
                </div>
                <div id="nicknameInputContainer" style="display: none;">
                    <input 
                        type="text" 
                        id="nicknameInput" 
                        placeholder="输入昵称（可选）" 
                        style="width: 100%; padding: 8px; background: #3a3a3a; border: 1px solid #404040; border-radius: 4px; color: #fff; font-size: 0.9em; margin-bottom: 10px;"
                        maxlength="20"
                    />
                    <button 
                        id="joinRoomButton" 
                        style="width: 100%; padding: 8px; background: #4a9eff; border: none; border-radius: 4px; color: #fff; font-size: 0.9em; font-weight: 600; cursor: pointer; transition: background 0.2s;"
                    >
                        加入房间
                    </button>
                </div>
                <div id="nicknameDisplay" style="display: none;">
                    <div style="font-size: 0.9em; color: #aaa; margin-bottom: 8px;">昵称:</div>
                    <div style="color: #4a9eff; font-weight: 600; margin-bottom: 10px;" id="currentNickname"></div>
                    <button 
                        id="changeNicknameButton" 
                        style="width: 100%; padding: 6px; background: #3a3a3a; border: 1px solid #404040; border-radius: 4px; color: #fff; font-size: 0.85em; cursor: pointer; transition: background 0.2s;"
                    >
                        修改昵称
                    </button>
                </div>
            </div>
            <div class="sidebar-section" style="flex: 0 0 auto; max-height: 200px; overflow-y: auto;">
                <h2>成员列表</h2>
                <ul class="members-list" id="membersList">
                    <li class="members-empty">暂无成员</li>
                </ul>
            </div>
            <div class="chat-section">
                <div class="sidebar-section" style="padding: var(--space-md); border-bottom: 1px solid var(--color-border); flex-shrink: 0;">
                    <h2>聊天</h2>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-empty">暂无消息</div>
                </div>
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <textarea 
                            id="chatInput" 
                            class="chat-input" 
                            placeholder="输入消息..." 
                            rows="2"
                            maxlength="500"
                        ></textarea>
                        <button id="chatSendButton" class="chat-send-button">发送</button>
                    </div>
                </div>
            </div>
        </aside>
        <div class="browser-area shell__area">
            <div class="iframe-container">
                <div class="loading" id="loading" style="display: none;">正在加载...</div>
                <div class="error" id="error" style="display: none;">
                    <h3>加载失败</h3>
                    <p id="errorMessage"></p>
                </div>
                <!-- iframe 保留节点供 sync/operation-source 引用，不再加载 URL，始终隐藏 -->
                <iframe id="browserFrame" style="display: none !important;" title="已废弃"></iframe>
                <div class="video-container" id="videoContainer">
                    <div class="video-status" id="videoStatusLabel" style="display: none;">正在播放房主画面</div>
                    <video id="videoStream" style="display: none;"></video>
                    <canvas id="canvasStream" style="display: none;"></canvas>
                    <div class="video-placeholder" id="videoPlaceholder">
                        <h3>等待画面流</h3>
                        <p>房主开始共享后，画面将在这里显示</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/js/room.js"></script>
    <!-- WebRTC 信令工具函数（提供 createOfferMessage / createAnswerMessage 等） -->
    <script src="/js/webrtc-signaling.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/sync.js"></script>
    <script src="/js/webrtc-manager.js"></script>
    <script src="/js/screen-streaming.js"></script>
    <script src="/js/video-player.js"></script>
    <script src="/js/operation-source.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一起看 - 房间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: #1a1a1a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #2d2d2d;
            padding: 15px 20px;
            border-bottom: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.2em;
            font-weight: 600;
            color: #fff;
        }

        .room-info {
            font-size: 0.9em;
            color: #aaa;
        }

        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: #2d2d2d;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid #404040;
        }

        .sidebar-section h2 {
            font-size: 1em;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
        }

        .room-id-display {
            font-size: 1.1em;
            font-weight: 600;
            color: #4a9eff;
            word-break: break-all;
        }

        .members-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .member-item {
            padding: 10px 12px;
            margin-bottom: 8px;
            background: #3a3a3a;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            transition: background 0.2s;
        }

        .member-item:hover {
            background: #444;
        }

        .member-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #4a9eff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-weight: 600;
            font-size: 0.85em;
            flex-shrink: 0;
        }

        .member-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .members-empty {
            color: #888;
            font-size: 0.9em;
            text-align: center;
            padding: 20px 0;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-top: 1px solid #404040;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #252525;
        }

        .chat-message {
            margin-bottom: 15px;
            padding: 10px 12px;
            background: #3a3a3a;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .chat-message-header {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .chat-message-sender {
            font-weight: 600;
            color: #4a9eff;
            margin-right: 8px;
        }

        .chat-message-time {
            font-size: 0.75em;
            color: #888;
        }

        .chat-message-content {
            color: #fff;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .chat-input-container {
            padding: 15px;
            border-top: 1px solid #404040;
            background: #2d2d2d;
        }

        .chat-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 10px 12px;
            background: #3a3a3a;
            border: 1px solid #404040;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9em;
            font-family: inherit;
            resize: none;
        }

        .chat-input:focus {
            outline: none;
            border-color: #4a9eff;
        }

        .chat-send-button {
            padding: 10px 20px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-send-button:hover {
            background: #3a8eef;
        }

        .chat-send-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .chat-empty {
            color: #888;
            font-size: 0.9em;
            text-align: center;
            padding: 40px 20px;
        }

        .browser-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            overflow: hidden;
        }

        .iframe-container {
            flex: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: none;
            position: relative;
            background: #000;
            align-items: center;
            justify-content: center;
        }

        .video-container video,
        .video-container canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .video-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #aaa;
            padding: 40px;
        }

        .video-placeholder h3 {
            margin-bottom: 15px;
            color: #fff;
            font-size: 1.2em;
        }

        .video-placeholder p {
            color: #888;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .video-status {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.65);
            color: #aaa;
            font-size: 0.85em;
            border-radius: 6px;
            z-index: 2;
            pointer-events: none;
        }

        .url-control-container {
            position: absolute;
            top: 20px;
            right: 20px;
            display: none;
            z-index: 10;
        }

        .url-control-button {
            padding: 10px 20px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .url-control-button:hover {
            background: #3a8eef;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aaa;
            font-size: 1em;
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e74c3c;
            text-align: center;
            padding: 20px;
        }

        .error h3 {
            margin-bottom: 10px;
        }

        .error p {
            color: #aaa;
            font-size: 0.9em;
        }

        .start-sharing-button {
            padding: 10px 20px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 15px;
        }

        .start-sharing-button:hover {
            background: #3a8eef;
        }

        .start-sharing-button.streaming {
            background: #e74c3c;
        }

        .start-sharing-button.streaming:hover {
            background: #c0392b;
        }

        .share-room-button {
            width: 100%;
            padding: 10px 20px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .share-room-button:hover {
            background: #3a8eef;
        }

        .share-room-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* 底部聊天抽屉（可收起） */
        .chat-trigger-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: #2d2d2d;
            border-top: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-shrink: 0;
        }
        .chat-trigger-bar .chat-toggle-btn {
            padding: 10px 24px;
            background: #4a9eff;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-trigger-bar .chat-toggle-btn:hover {
            background: #3a8eef;
        }
        .chat-drawer {
            position: fixed;
            bottom: 48px;
            left: 0;
            right: 0;
            height: 0;
            max-height: 40vh;
            background: #2d2d2d;
            border-top: 1px solid #404040;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: height 0.25s ease-out;
            z-index: 999;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        }
        .chat-drawer.open {
            height: 40vh;
        }
        .chat-drawer-header {
            padding: 12px 16px;
            border-bottom: 1px solid #404040;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            background: #2d2d2d;
        }
        .chat-drawer-header h2 {
            font-size: 1em;
            font-weight: 600;
            color: #fff;
            margin: 0;
        }
        .chat-drawer-close {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #404040;
            border-radius: 6px;
            color: #aaa;
            font-size: 0.85em;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .chat-drawer-close:hover {
            background: #3a3a3a;
            color: #fff;
        }
        .chat-drawer .chat-messages {
            flex: 1;
            min-height: 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>一起看</h1>
        <div class="room-info" id="roomInfo">房间加载中...</div>
    </div>
    
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-section">
                <h2>房间信息</h2>
                <div class="room-id-display" id="sidebarRoomId">加载中...</div>
                <button id="shareRoomButton" class="share-room-button" style="display: none;">分享房间链接</button>
            </div>
            <div class="sidebar-section" id="userInfoSection">
                <h2>我的信息</h2>
                <div id="userInfoDisplay" style="margin-bottom: 15px;">
                    <div style="font-size: 0.9em; color: #aaa; margin-bottom: 8px;">用户ID:</div>
                    <div class="room-id-display" id="currentUserId" style="font-size: 0.9em;">生成中...</div>
                </div>
                <div id="nicknameInputContainer" style="display: none;">
                    <input 
                        type="text" 
                        id="nicknameInput" 
                        placeholder="输入昵称（可选）" 
                        style="width: 100%; padding: 8px; background: #3a3a3a; border: 1px solid #404040; border-radius: 4px; color: #fff; font-size: 0.9em; margin-bottom: 10px;"
                        maxlength="20"
                    />
                    <button 
                        id="joinRoomButton" 
                        style="width: 100%; padding: 8px; background: #4a9eff; border: none; border-radius: 4px; color: #fff; font-size: 0.9em; font-weight: 600; cursor: pointer; transition: background 0.2s;"
                    >
                        加入房间
                    </button>
                </div>
                <div id="nicknameDisplay" style="display: none;">
                    <div style="font-size: 0.9em; color: #aaa; margin-bottom: 8px;">昵称:</div>
                    <div style="color: #4a9eff; font-weight: 600; margin-bottom: 10px;" id="currentNickname"></div>
                    <button 
                        id="changeNicknameButton" 
                        style="width: 100%; padding: 6px; background: #3a3a3a; border: 1px solid #404040; border-radius: 4px; color: #fff; font-size: 0.85em; cursor: pointer; transition: background 0.2s;"
                    >
                        修改昵称
                    </button>
                </div>
            </div>
            <div class="sidebar-section" style="flex: 0 0 auto; max-height: 200px; overflow-y: auto;">
                <h2>成员列表</h2>
                <ul class="members-list" id="membersList">
                    <li class="members-empty">暂无成员</li>
                </ul>
            </div>
        </div>
        <div class="browser-area">
            <div class="iframe-container">
                <div class="loading" id="loading">正在加载网页...</div>
                <div class="error" id="error" style="display: none;">
                    <h3>加载失败</h3>
                    <p id="errorMessage"></p>
                </div>
                <div id="urlInputContainer" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 600px; padding: 30px; background: #2d2d2d; border-radius: 8px; border: 1px solid #404040;">
                    <h3 style="margin-bottom: 15px; color: #fff; font-size: 1.2em;">设置要观看的网页</h3>
                    <p style="color: #aaa; font-size: 0.9em; margin-bottom: 20px;">作为房主，请输入要分享的网页地址</p>
                    <input 
                        type="text" 
                        id="urlInput" 
                        placeholder="https://www.example.com" 
                        style="width: 100%; padding: 12px; background: #3a3a3a; border: 1px solid #404040; border-radius: 6px; color: #fff; font-size: 1em; margin-bottom: 15px; font-family: inherit;"
                    />
                    <div style="display: flex; gap: 10px;">
                        <button 
                            id="loadUrlButton" 
                            style="flex: 1; padding: 12px; background: #4a9eff; border: none; border-radius: 6px; color: #fff; font-size: 1em; font-weight: 600; cursor: pointer; transition: background 0.2s;"
                        >
                            加载网页
                        </button>
                    </div>
                </div>
                <div class="url-control-container" id="urlControlContainer">
                    <button class="url-control-button" id="changeUrlButton">修改 URL</button>
                </div>
                <iframe id="browserFrame" style="display: none;"></iframe>
                <div class="video-container" id="videoContainer">
                    <div class="video-status" id="videoStatusLabel" style="display: none;">正在播放房主画面</div>
                    <video id="videoStream" style="display: none;"></video>
                    <canvas id="canvasStream" style="display: none;"></canvas>
                    <div class="video-placeholder" id="videoPlaceholder">
                        <h3>等待画面流</h3>
                        <p>房主设置网页后，画面将在这里显示</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部聊天入口与抽屉（可收起） -->
    <div class="chat-trigger-bar" id="chatTriggerBar">
        <button type="button" class="chat-toggle-btn" id="chatToggleBtn" aria-expanded="false">评论/聊天</button>
    </div>
    <div class="chat-drawer" id="chatDrawer" aria-hidden="true">
        <div class="chat-drawer-header">
            <h2>聊天</h2>
            <button type="button" class="chat-drawer-close" id="chatDrawerClose">收起</button>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="chat-empty">暂无消息</div>
        </div>
        <div class="chat-input-container">
            <div class="chat-input-wrapper">
                <textarea 
                    id="chatInput" 
                    class="chat-input" 
                    placeholder="输入消息..." 
                    rows="2"
                    maxlength="500"
                ></textarea>
                <button id="chatSendButton" class="chat-send-button">发送</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        var drawer = document.getElementById('chatDrawer');
        var toggleBtn = document.getElementById('chatToggleBtn');
        var closeBtn = document.getElementById('chatDrawerClose');
        if (drawer && toggleBtn) {
            function openDrawer() {
                drawer.classList.add('open');
                drawer.setAttribute('aria-hidden', 'false');
                toggleBtn.setAttribute('aria-expanded', 'true');
                toggleBtn.textContent = '收起聊天';
            }
            function closeDrawer() {
                drawer.classList.remove('open');
                drawer.setAttribute('aria-hidden', 'true');
                toggleBtn.setAttribute('aria-expanded', 'false');
                toggleBtn.textContent = '评论/聊天';
            }
            toggleBtn.addEventListener('click', function() {
                if (drawer.classList.contains('open')) closeDrawer();
                else openDrawer();
            });
            if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
        }
    })();
    </script>
    
    <script src="/js/room.js"></script>
    <!-- WebRTC 信令工具函数（提供 createOfferMessage / createAnswerMessage 等） -->
    <script src="/js/webrtc-signaling.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/sync.js"></script>
    <script src="/js/webrtc-manager.js"></script>
    <script src="/js/screen-streaming.js"></script>
    <script src="/js/video-player.js"></script>
    <script src="/js/operation-source.js"></script>
</body>
</html>

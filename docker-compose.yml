version: '3.8'

services:
  watch-together:
    build:
      context: .
      dockerfile: ./watch-together/Dockerfile
    container_name: watch-together
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - watch-together-network
    depends_on:
      - postgres

  postgres:
    build:
      context: ./watch-together-server
      dockerfile: Dockerfile.postgres
    container_name: watch-together-postgres
    environment:
      POSTGRES_USER: watchtogether
      POSTGRES_PASSWORD: watchtogether123
      POSTGRES_DB: watchtogether
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchtogether"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - watch-together-network

volumes:
  postgres_data:

networks:
  watch-together-network:
    driver: bridge

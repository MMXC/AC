name: 单元测试和集成测试

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: 设置 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: watch-together-server/package-lock.json

      - name: 安装依赖
        working-directory: watch-together-server
        run: npm ci

      - name: 生成 Prisma Client
        working-directory: watch-together-server
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: 运行数据库迁移
        working-directory: watch-together-server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

      - name: 运行测试并生成覆盖率报告
        working-directory: watch-together-server
        run: npm test -- --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          directory: watch-together-server/coverage
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: 检查覆盖率阈值
        working-directory: watch-together-server
        run: |
          COVERAGE=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json')); const total = data.total; console.log(total.lines.pct);")
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "覆盖率 $COVERAGE% 低于 80% 阈值"
            exit 1
          else
            echo "覆盖率 $COVERAGE% 达到 80% 阈值"
          fi
